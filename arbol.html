let matchedList = [];

function normalize(str) {
    return str
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // remove accents
        .replace(/\s+/g, " ") // collapse spaces
        .trim()
        .toUpperCase();
}

let normalizedCadena1 = cadena1.map(name => ({
    original: name,
    normalized: normalize(name.split(" ").reverse().join(" "))
}));

let normalizedCadena2 = cadena2.map(name => normalize(name));

for (let name2 of normalizedCadena2) {
    let match = normalizedCadena1.find(obj => obj.normalized === name2);
    if (match) {
        matchedList.push(match.original);
    }
}

// Print the matched list in an HTML table
let table = "<table border='1'><tr><th>#</th><th>Nombre</th></tr>";

    table += `<tr><td>${idx + 1}</td><td>${name}</td></tr>`;
});
